name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m usage_dashboard --config examples/config.demo.json --check
      - name: Validate multi-provider example without network access
        run: python -m usage_dashboard --config examples/config.multi-provider.example.json --check
      - run: python -m pip install .
      - run: cd /tmp && usage-dashboard --version
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t usage-dashboard:test .
